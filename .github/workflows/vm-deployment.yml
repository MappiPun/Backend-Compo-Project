name: Deploy backend to VM
# Only needed when you deploy to your own VM (IaaS). With Render the "prod" branch is deployed by Render itself.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/se331-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/se331-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy compose file to the VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          source: "docker-compose-prod.yml"
          target: "backend"
          overwrite: true
      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          envs: BACKEND_ENV
          script: |
            cd ~/backend
            mv -f docker-compose-prod.yml docker-compose.yml
            printf '%s\n' "$BACKEND_ENV" > .env
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
