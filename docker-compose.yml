# Local development: docker compose up -d   then run the Spring Boot application from IntelliJ
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: selabdb
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - "9000:8080"

volumes:
  pgdata:
